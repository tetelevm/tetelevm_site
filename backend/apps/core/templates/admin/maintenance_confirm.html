{% extends "admin/base_site.html" %}
{% load i18n %}

{% block breadcrumbs %}
  <div class="breadcrumbs">
    <a href="{% url 'admin:index' %}">{% translate "Home" %}</a>
    &rsaquo; <a href="{% url back_url %}">{{ opts.verbose_name_plural|capfirst }}</a>
    &rsaquo; {{ title }}
  </div>
{% endblock %}

{% block content %}
  <p>{{ description }}</p>
  <form method="post">
    {% csrf_token %}
    <input type="submit" value="Выполнить">
    <a href="{% url back_url %}">Отмена</a>
  </form>
{% endblock %}
